services:
  refactor_db:
    container_name: guest_pg
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

    ports:
      - 5403:5432
    volumes:
      - guest_pg_refactor:/var/lib/postgresql/data
    networks:
      - guest-refactor

  refactor_redis:
    container_name: guest_redis
    image: redis:5.0
    restart: always
    ports:
      - 6371:6379
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - guest_refactor:/data
    networks:
      - guest-refactor

  refactor_qdrant:
    container_name: guest_qdrant
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - 6333:6333
    volumes:
      - guest_qdrant:/qdrant/storage
    networks:
      - guest-refactor

volumes:
  guest_pg_refactor:
  guest_refactor:
  guest_qdrant:

networks:
  guest-refactor:
