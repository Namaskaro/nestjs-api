# Conformance candidate, not a production deployment. Both APIs stay native.
model_list:
  - model_name: support-fast
    litellm_params:
      model: os.environ/FAST_MODEL
      custom_llm_provider: openai
      api_base: os.environ/FAST_API_BASE
      api_key: os.environ/FAST_API_KEY
      max_retries: 0
  - model_name: support-standard
    litellm_params:
      model: os.environ/STANDARD_MODEL
      custom_llm_provider: openai
      api_base: os.environ/STANDARD_API_BASE
      api_key: os.environ/STANDARD_API_KEY
      max_retries: 0
router_settings:
  num_retries: 0
  max_fallbacks: 0
  fallbacks: []
  context_window_fallbacks: []
  content_policy_fallbacks: []
  disable_cooldowns: true
  timeout: 3
litellm_settings:
  num_retries: 0
  drop_params: false
  telemetry: false
  turn_off_message_logging: true
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: false
  cancel_on_disconnect: true
