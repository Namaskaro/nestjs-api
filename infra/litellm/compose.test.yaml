# Test-only: fake keys and loopback mock providers. Never load a real .env here.
name: support-ai-contract
services:
  gateway-contract:
    image: ghcr.io/berriai/litellm:v1.100.3@sha256:a68b34df312f1e72914f0886384517fa4fdb09013480460b80a4e3a40104376b
    entrypoint: ["python", "/gateway/tests/runtime.py"]
    volumes:
      - ./:/gateway:ro
    ports:
      - "127.0.0.1:34180:9180"
      - "127.0.0.1:34181:9181"
      - "127.0.0.1:34182:9182"
    networks: [offline]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9180/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      start_period: 60s
      retries: 10
networks:
  offline:
    driver: bridge
