model_list:
  - model_name: support-fast
    litellm_params:
      model: os.environ/YANDEX_LITE_MODEL
      custom_llm_provider: openai
      api_base: os.environ/YANDEX_API_URL
      api_key: os.environ/YANDEX_API_KEY
      use_chat_completions_api: true
      temperature: 0
      max_retries: 0
    model_info:
      id: support-fast-yandex
      transport_profile: yandex-chat
  - model_name: support-standard
    litellm_params:
      model: os.environ/YANDEX_MODEL
      custom_llm_provider: openai
      api_base: os.environ/YANDEX_API_URL
      api_key: os.environ/YANDEX_API_KEY
      use_chat_completions_api: true
      temperature: 0
      max_retries: 0
    model_info:
      id: support-standard-yandex
      transport_profile: yandex-chat

router_settings:
  num_retries: 0
  max_fallbacks: 0
  fallbacks: []
  context_window_fallbacks: []
  content_policy_fallbacks: []
  timeout: 60

litellm_settings:
  drop_params: false
  telemetry: false
  turn_off_message_logging: true
  callbacks: [gateway_policy.policy]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: false
  fail_closed_budget_enforcement: true
